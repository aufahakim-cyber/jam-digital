<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #FF8E01;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;

      color: White;
      font-family: Arial, Helvetica, sans-serif;

      overflow: hidden;
    }

    .clock {
      text-align: center;
    }

    #time {
      font-size: 70px;
      font-weight: bold;
      letter-spacing: 4px;
      line-height: 1;
    }

    #date {
      margin-top: 5px;
      font-weight: bold;
      font-size: 20px;
      color: White;
    }
  </style>
</head>

<body>

  <div class="clock">
    <div id="time">00:00:00</div>
    <div id="date">Memuat...</div>
  </div>

  <script>
    function updateClock() {

      const now = new Date();

      const time = new Intl.DateTimeFormat('id-ID', {
        timeZone: 'Asia/Jakarta',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).format(now);

      const date = new Intl.DateTimeFormat('id-ID', {
        timeZone: 'Asia/Jakarta',
        weekday: 'long',
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      }).format(now);

      document.getElementById('time').textContent = time;
      document.getElementById('date').textContent = date;
    }

    updateClock();

    setInterval(updateClock, 1000);
  </script>

</body>
</html>
